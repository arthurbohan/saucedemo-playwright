name: On Merge

# Push-only, separate from pr-checks.yml on purpose: this never re-runs the
# test suite. It locates the pull_request run that already tested this exact
# commit and sends a short "merged, checks were green" Telegram notification
# — no Allure publish here. A merge only happens once pr-checks.yml already
# passed, so re-publishing a report that's guaranteed green adds nothing;
# the Allure report lives in full-regression.yml / npm run regression
# instead, where it actually reflects a fresh, specific run someone asked
# to see.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── JOB 1: Locate the merged PR's CI run ────────────────────────────────────
  #
  # Resolves which pr-checks.yml run already tested this exact code — mainly
  # so notify-telegram below can link back to it and name the PR. Works for
  # any merge strategy — uses GitHub's own commit↔PR tracking, not a
  # SHA/message guess. See .github/scripts/find-pr-run.js.

  find-pr-run:
    name: Locate merged PR's CI run
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      actions: read
      pull-requests: read

    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      conclusion: ${{ steps.find.outputs.conclusion }}
      pr_number: ${{ steps.find.outputs.pr_number }}
      pr_title: ${{ steps.find.outputs.pr_title }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find the merged PR's CI run
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const find = require('./.github/scripts/find-pr-run.js')
            await find({ github, context, core })

  # ─── JOB 2: Telegram notification ────────────────────────────────────────────
  #
  # A merge announcement, not a fresh test report: pr-checks.yml already had
  # to pass for this push to exist. The AI-analysis download below only ever
  # finds something on the rare case find-pr-run resolves a non-success
  # conclusion (e.g. a direct push bypassing review) — normal merges have
  # nothing to download there.

  notify-telegram:
    name: Telegram Notification
    runs-on: ubuntu-latest
    needs: find-pr-run
    if: always() && needs.find-pr-run.outputs.run_id != ''

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AI analysis (if exists)
        uses: actions/download-artifact@v4
        if: needs.find-pr-run.outputs.conclusion == 'failure'
        with:
          pattern: ai-analysis-*
          path: ai-summaries/
          merge-multiple: true
          run-id: ${{ needs.find-pr-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Send Telegram notification
        run: bash .github/scripts/notify-telegram.sh
        env:
          # Untrusted values (PR title etc.) travel as env vars, never as
          # ${{ }} text interpolated straight into the shell script.
          # E2E_STATUS/API_STATUS both carry the PR run's single overall
          # conclusion — there's no separate e2e/api result to report here,
          # the suite already ran once, on the PR.
          E2E_STATUS: ${{ needs.find-pr-run.outputs.conclusion }}
          API_STATUS: ${{ needs.find-pr-run.outputs.conclusion }}
          EVENT_NAME: merged
          PR_NUMBER: ${{ needs.find-pr-run.outputs.pr_number }}
          PR_TITLE: ${{ needs.find-pr-run.outputs.pr_title }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ needs.find-pr-run.outputs.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_SUMMARY_PATH: ai-summaries/ai-analysis-summary.md
