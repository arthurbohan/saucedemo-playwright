name: PR Checks

# Everything here is gated on a pull_request event — no push trigger, no
# per-job `if: github.event_name == ...` checks needed. See on-merge.yml for
# the separate, merge-only pipeline (Allure publish + Telegram notify).

on:
  pull_request:
    branches: [main]

# Least-privilege default — jobs that need more (risk-analysis and the
# smoke jobs need pull-requests, cleanup needs actions) declare their own
# `permissions:` block, which fully replaces this default for that job
# rather than adding to it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── JOB 0: Lint ──────────────────────────────────────────────────────────
  #
  # Unlike risk-analysis below, this IS a required check — lint is
  # deterministic and fast (no AI, no network), so a failure here is a real
  # problem to fix, not a fuzzy judgment call to just surface for review.

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─── JOB 1: E2E smoke ─────────────────────────────────────────────────────
  #
  # This is the actual merge gate — a small, curated set of tests tagged
  # @smoke (one per critical flow: login, add-to-cart, cart navigation,
  # product detail navigation, a full checkout, an API CRUD chain), not the
  # whole suite. Running everything on every PR doesn't scale once the
  # suite is large, and this repo tests a third-party app it doesn't
  # control — an unrelated outage there shouldn't block every PR the same
  # way a 1000-test run would. The full suite still runs, just not as a PR
  # gate — see full-regression.yml.
  # No sharding: 6 tests don't need 4 workers.

  test-e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy

    permissions:
      contents: read
      pull-requests: write # for the self-healing summary PR comment below

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E smoke tests
        run: npx playwright test --project=sd-e2e --grep @smoke
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_GC: 1
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Runs only when tests fail — analyzes root cause via the Claude Code
      # CLI (helpers/claude/), authenticated with a Pro/Max subscription's
      # CLAUDE_CODE_OAUTH_TOKEN rather than a billed API key — for whoever
      # fixes the automation. SKIP_MANUAL_VERDICT: no Telegram job reads
      # this here anyway (see on-merge.yml), so the manual-tester verdict
      # section — meant for full-regression.yml's audience — is skipped
      # rather than generated and never shown to anyone. Results appear as
      # a collapsible group in GitHub Actions logs.
      - name: Install Claude Code CLI
        if: failure()
        run: npm install -g @anthropic-ai/claude-code

      - name: AI Analysis of failures
        if: failure()
        run: npx tsx scripts/analyzeFailure.ts
        env:
          CI: true
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SKIP_MANUAL_VERDICT: true

      # Always runs — a healed locator can pass, so this isn't gated on failure()
      # like the AI failure analysis above. Surfaces which tests only passed
      # because a broken locator got recovered mid-run. No-arg mode skips
      # writing the file when there was no activity (see
      # scripts/summarizeHealing.ts) — the common case for a 5-test smoke
      # run — so the next step can't assume the file exists.
      - name: Self-Healing Summary
        if: always()
        run: npx tsx scripts/summarizeHealing.ts

      - name: Check self-healing summary was generated
        id: healing-check
        if: always()
        run: echo "exists=$([ -f self-healing-summary.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # A single job now (no shards to merge across), so this can post
      # directly instead of the old separate merge-healing-summary job.
      # Updates the same comment on every push instead of spamming a new
      # one, same as risk-analysis below. continue-on-error: this is PR
      # commentary, not a test result — a transient failure here (API
      # hiccup, missing file) must never fail a required check the way it
      # did the first time this ran (see commit history).
      - name: Post self-healing summary as PR comment
        if: always() && steps.healing-check.outputs.exists == 'true'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: self-healing-summary
          path: self-healing-summary.md

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-e2e-smoke
          path: allure-results/
          retention-days: 1

      - name: Upload AI analysis summary
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ai-analysis-e2e-smoke
          path: ai-analysis-summary.md
          retention-days: 7

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts-e2e-smoke
          path: test-results/
          retention-days: 7

  # ─── JOB 2: API smoke ─────────────────────────────────────────────────────

  test-api-smoke:
    name: API Smoke
    runs-on: ubuntu-latest
    # 5 -> 8: Claude CLI calls (helpers/claude/) run several seconds to
    # minutes slower per call than Groq's plain HTTP request, on top of the
    # CLI install step itself — see "Install Claude Code CLI" below.
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API smoke tests
        run: npx playwright test --project=jp-api --grep @smoke
        env:
          CI: true

      - name: Install Claude Code CLI
        if: failure()
        run: npm install -g @anthropic-ai/claude-code

      - name: AI Analysis of failures
        if: failure()
        run: npx tsx scripts/analyzeFailure.ts
        env:
          CI: true
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SKIP_MANUAL_VERDICT: true

      - name: Upload AI analysis summary
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ai-analysis-api-smoke
          path: ai-analysis-summary.md
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api-smoke
          path: allure-results/
          retention-days: 1

  # ─── JOB 3: AI risk analysis (PR advisory — never gates the merge) ───────────
  #
  # Deliberately NOT a replacement for the smoke gate above: it's a fast
  # (~seconds) signal for the reviewer, posted as a PR comment, while the
  # smoke jobs remain the actual required checks. See README § Risk Analysis.

  risk-analysis:
    name: AI Risk Analysis (PR advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AI risk analysis
        run: npx tsx scripts/analyzeRisk.ts origin/${{ github.event.pull_request.base.ref }}
        env:
          CI: true
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true # advisory only — never fail the PR over this

      - name: Check report was generated
        id: check
        if: always()
        run: echo "exists=$([ -f ai-risk-analysis.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Updates the same comment on every push instead of spamming a new one —
      # sticky-pull-request-comment handles the find-or-create logic itself.
      # Pinned to a commit SHA (v2.9.4), not the mutable @v2 tag — this step
      # runs with pull-requests: write, so a compromised tag would be a real
      # supply-chain risk otherwise.
      - name: Post risk analysis as PR comment
        if: always() && steps.check.outputs.exists == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: ai-risk-analysis
          path: ai-risk-analysis.md

  # ─── JOB 4: Cleanup old artifacts ────────────────────────────────────────────

  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    needs: [lint, test-e2e-smoke, test-api-smoke, risk-analysis]
    if: always()

    # listWorkflowRunArtifacts/deleteArtifact need the `actions` scope —
    # without it this job 403s on every delete call (silently red, since
    # nothing downstream depends on it)
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cleanup = require('./.github/scripts/cleanup-artifacts.js')
            await cleanup({ github, context })
