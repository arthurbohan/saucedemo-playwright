name: PR Checks

# Everything here is gated on a pull_request event — no push trigger, no
# per-job `if: github.event_name == ...` checks needed. See on-merge.yml for
# the separate, merge-only pipeline (Allure publish + Telegram notify).

on:
  pull_request:
    branches: [main]

# Least-privilege default — jobs that need more (risk-analysis needs
# pull-requests, cleanup needs actions) declare their own `permissions:`
# block, which fully replaces this default for that job rather than adding
# to it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── JOB 0: Lint ──────────────────────────────────────────────────────────
  #
  # Unlike risk-analysis below, this IS a required check — lint is
  # deterministic and fast (no AI, no network), so a failure here is a real
  # problem to fix, not a fuzzy judgment call to just surface for review.

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─── JOB 1: E2E tests with sharding + Docker ─────────────────────────────────
  #
  # This is the actual merge gate. It deliberately does NOT also run on
  # merge (see on-merge.yml): that would re-test the exact same code a
  # second time right after it already ran here. publish-allure /
  # notify-telegram over there reuse THIS run's artifacts instead of
  # triggering a fresh run.

  test-e2e:
    name: E2E Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npx playwright test --project=sd-e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_GC: 1
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Runs only when tests fail — analyzes root cause via Groq API
      # Results appear as a collapsible group in GitHub Actions logs
      - name: AI Analysis of failures
        if: failure()
        run: npx tsx scripts/analyzeFailure.ts
        env:
          CI: true
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Always runs — a healed locator can pass, so this isn't gated on failure()
      # like the AI failure analysis above. Surfaces which tests only passed
      # because a broken locator got recovered mid-run.
      - name: Self-Healing Summary
        if: always()
        run: npx tsx scripts/summarizeHealing.ts

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-shard-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 1

      - name: Upload AI analysis summary
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ai-analysis-shard-${{ matrix.shardIndex }}
          path: ai-analysis-summary.md
          retention-days: 7

      - name: Upload self-healing summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-healing-shard-${{ matrix.shardIndex }}
          path: self-healing-summary.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts-shard-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7

  # ─── JOB 2: API tests ────────────────────────────────────────────────────────

  test-api:
    name: API Tests (jsonplaceholder)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api
        env:
          CI: true

      - name: AI Analysis of failures
        if: failure()
        run: npx tsx scripts/analyzeFailure.ts
        env:
          CI: true
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload AI analysis summary
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ai-analysis-api
          path: ai-analysis-summary.md
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: allure-results/
          retention-days: 1

  # ─── JOB 3: AI risk analysis (PR advisory — never gates the merge) ───────────
  #
  # Deliberately NOT a replacement for the full regression above: it's a fast
  # (~seconds) signal for the reviewer, posted as a PR comment, while test-e2e
  # / test-api remain the actual required checks. See README § Risk Analysis.

  risk-analysis:
    name: AI Risk Analysis (PR advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AI risk analysis
        run: npx tsx scripts/analyzeRisk.ts origin/${{ github.event.pull_request.base.ref }}
        env:
          CI: true
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true # advisory only — never fail the PR over this

      - name: Check report was generated
        id: check
        if: always()
        run: echo "exists=$([ -f ai-risk-analysis.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Updates the same comment on every push instead of spamming a new one —
      # sticky-pull-request-comment handles the find-or-create logic itself.
      # Pinned to a commit SHA (v2.9.4), not the mutable @v2 tag — this step
      # runs with pull-requests: write, so a compromised tag would be a real
      # supply-chain risk otherwise.
      - name: Post risk analysis as PR comment
        if: always() && steps.check.outputs.exists == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: ai-risk-analysis
          path: ai-risk-analysis.md

  # ─── JOB 4: Merge Playwright shard reports ───────────────────────────────────

  merge-reports:
    name: Merge E2E Reports
    runs-on: ubuntu-latest
    needs: test-e2e
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 14

  # ─── JOB 5: Cleanup old artifacts ────────────────────────────────────────────

  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    needs: [lint, test-e2e, test-api, risk-analysis, merge-reports]
    if: always()

    # listWorkflowRunArtifacts/deleteArtifact need the `actions` scope —
    # without it this job 403s on every delete call (silently red, since
    # nothing downstream depends on it)
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cleanup = require('./.github/scripts/cleanup-artifacts.js')
            await cleanup({ github, context })
